<script>
    // 自動載入預存的 API Key
    document.addEventListener("DOMContentLoaded", () => {
        const savedKey = localStorage.getItem("gemini_api_key");
        if (savedKey) document.getElementById("apiKey").value = savedKey;
    });

    async function fileToBase64(file) {
        return new Promise((resolve, reject) => {
            const reader = new FileReader();
            reader.onload = () => resolve(reader.result.split(',')[1]);
            reader.onerror = error => reject(error);
        });
    }

    async function processImages() {
        const apiKey = document.getElementById("apiKey").value.trim();
        const files = document.getElementById("imageInput").files;
        const title = document.getElementById("titleInput").value.trim() || "餐費總結算";
        const statusDiv = document.getElementById("status");
        const calcBtn = document.getElementById("calcBtn");
        const resultArea = document.getElementById("result-area");
        const outputText = document.getElementById("output");

        if (!apiKey) {
            alert("請先輸入 Gemini API Key！");
            return;
        }
        if (files.length === 0) {
            alert("請至少上傳一張圖片！");
            return;
        }

        // 儲存 API Key 方便下次使用
        localStorage.setItem("gemini_api_key", apiKey);

        statusDiv.innerText = "⏳ AI 分析中，請稍候...";
        calcBtn.disabled = true;
        resultArea.style.display = "none";

        try {
            const imageParts = [];
            for (let file of files) {
                const base64Data = await fileToBase64(file);
                imageParts.push({
                    inlineData: {
                        mimeType: file.type,
                        data: base64Data
                    }
                });
            }

            const promptText = `
你是一個專業的香港餐費結算助手。請分析上傳的所有圖片（包含餐廳單據截圖、點餐菜單、WhatsApp 點餐訊息對話）。

任務說明：
1. 辨識照片中每一位同事（人名/暱稱）所點的餐點項目。
2. 對照單據或菜單價格，計算每位同事應付的【總金額】（如有多日或多餐，請自動加總）。
3. 輸出為嚴格的 JSON 格式，不可以有任何 Markdown 標籤，格式如下：
{
  "summary": [
    {"name": "同事A", "amount": 150},
    {"name": "同事B", "amount": 120}
  ],
  "grandTotal": 270
}
請確保人名準確、金額計算無誤。
`;

            const requestBody = {
                contents: [{
                    parts: [
                        { text: promptText },
                        ...imageParts
                    ]
                }]
            };

            // 修正 URL Fetch 語法
            const response = await fetch(`[https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent?key=$](https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent?key=$){apiKey}`, {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify(requestBody)
            });

            const data = await response.json();
            
            if (data.error) {
                throw new Error(data.error.message || "API 呼叫失敗");
            }

            const rawText = data.candidates[0].content.parts[0].text.trim();
            
            // 強化 JSON 擷取邏輯，確保 Parse 不會爆
            const jsonMatch = rawText.match(/\{[\s\S]*\}/);
            if (!jsonMatch) {
                throw new Error("未能成功解析 AI 回覆內容，請再試一次。");
            }
            const parsedData = JSON.parse(jsonMatch[0]);

            // 排版為 WhatsApp 格式
            let formattedMsg = `📢 *【${title}】*\n──────────────────\n\n`;
            
            parsedData.summary.forEach(item => {
                formattedMsg += `👤 *${item.name}*  👉  *_$${item.amount}_*\n`;
            });

            formattedMsg += `\n──────────────────\n💰 *全數總計：*_$${parsedData.grandTotal}_\n\n請按 PayMe / FPS 轉帳，謝謝！🙏`;

            outputText.value = formattedMsg;
            resultArea.style.display = "block";
            statusDiv.innerText = "✅ 計算完成！";

        } catch (err) {
            console.error(err);
            statusDiv.innerText = "❌ 發生錯誤：" + err.message;
        } finally {
            calcBtn.disabled = false;
        }
    }

    // 升級 Clipboard API
    async function copyResult() {
        const outputText = document.getElementById("output");
        try {
            await navigator.clipboard.writeText(outputText.value);
            alert("已複製到剪貼簿！可直接貼上至 WhatsApp。");
        } catch (err) {
            outputText.select();
            document.execCommand("copy");
            alert("已複製到剪貼簿！可直接貼上至 WhatsApp。");
        }
    }
</script>
